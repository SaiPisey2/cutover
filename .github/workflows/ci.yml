name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Nothing here writes to the repository. Actions are pinned to commit SHAs
# because a tag like @v7 can be moved by its owner at any time.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found unformatted files" >&2
            exit 1
          fi
      - run: make vet
      - run: make test
      - run: CGO_ENABLED=0 go build ./cmd/cutover

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      # pg_dump refuses a server newer than itself, and the harness runs
      # Postgres 17. The runner ships an older client.
      - name: Install Postgres 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # The crash tests start a real Temporal dev server. Pinned to the
      # version they were verified against, checked against its checksum.
      - name: Install Temporal CLI 1.7.2
        run: |
          curl -fsSLo temporal.tgz https://github.com/temporalio/cli/releases/download/v1.7.2/temporal_cli_1.7.2_linux_amd64.tar.gz
          echo "e2f548af84e820b7d71f25fc6461a4e6a1ab7cdb6a80fde3c375641b0772375b  temporal.tgz" | sha256sum -c -
          tar -xzf temporal.tgz temporal
          sudo mv temporal /usr/local/bin/temporal
          rm temporal.tgz
          temporal --version
      # The front door's tests run Envoy natively (Docker cannot reach
      # services on the host's loopback). Pinned and checksummed.
      - name: Install Envoy 1.40.0
        run: |
          curl -fsSLo envoy https://github.com/envoyproxy/envoy/releases/download/v1.40.0/envoy-1.40.0-linux-x86_64
          echo "8aa137a7d00994ce43f613556f5a120709229f63bedb86eedde5ccbc402c2b80  envoy" | sha256sum -c -
          chmod +x envoy
          sudo mv envoy /usr/local/bin/envoy
          envoy --version
      - run: make itest-up
      - run: make itest
      - name: Container logs
        if: failure()
        run: docker compose -f test/compose.yaml logs --no-color --tail 200
      - if: always()
        run: make itest-down

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      # Same client as the integration job: pg_dump must not be older than
      # the server.
      - name: Install Postgres 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Install Temporal CLI 1.7.2
        run: |
          curl -fsSLo temporal.tgz https://github.com/temporalio/cli/releases/download/v1.7.2/temporal_cli_1.7.2_linux_amd64.tar.gz
          echo "e2f548af84e820b7d71f25fc6461a4e6a1ab7cdb6a80fde3c375641b0772375b  temporal.tgz" | sha256sum -c -
          tar -xzf temporal.tgz temporal
          sudo mv temporal /usr/local/bin/temporal
          rm temporal.tgz
          temporal --version
      - name: Install Envoy 1.40.0
        run: |
          curl -fsSLo envoy https://github.com/envoyproxy/envoy/releases/download/v1.40.0/envoy-1.40.0-linux-x86_64
          echo "8aa137a7d00994ce43f613556f5a120709229f63bedb86eedde5ccbc402c2b80  envoy" | sha256sum -c -
          chmod +x envoy
          sudo mv envoy /usr/local/bin/envoy
          envoy --version
      # Pinned and checksummed like the others. kubectl comes with the runner.
      - name: Install kind v0.33.0
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - run: make e2e-up
      - run: KUBECONFIG=/nonexistent make e2e-test
      - if: always()
        run: make e2e-down
      # Only logs: the run directory also holds keys and kubeconfigs.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: test/run/e2e/logs
          if-no-files-found: ignore

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # npm ci installs exactly package-lock.json and fails if it disagrees
      # with package.json, so CI cannot quietly pick up a newer dependency.
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      # ui/dist is committed and embedded into the Go binary. If a fresh
      # build differs from it, the binary would ship a UI that is not what
      # the sources say.
      - name: Committed ui/dist matches the build
        run: |
          git diff --exit-code -- dist
          untracked=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "ui/dist has files the commit does not" >&2
            exit 1
          fi

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit trailers
        run: |
          if git log --format='%H %B' | grep -iE 'co-authored-by:|generated with|noreply@'; then
            echo "commit history contains an attribution trailer" >&2
            exit 1
          fi
          echo "history clean"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
